<!DOCTYPE html>
<html lang="es_MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor Básico HTML | ElmichiYT</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }
    header {
      background: #333;
      color: #fff;
      padding: 0.5em 1em;
      font-size: 1.2em;
    }
    main {
      display: flex;
      height: calc(100% - 2.5em);
    }
    .editor {
      display: flex;
      flex-direction: column;
      width: 55%;
      border-right: 1px solid #333;
      min-width: 300px;
      resize: horizontal;
      overflow: auto;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      background: #333;
    }
    .tabs button {
      flex: 1;
      padding: 0.5em;
      border: none;
      background: #555;
      cursor: pointer;
      min-width: 70px;
      color: white;
    }
    .tabs button.active {
      background: #777;
      border-bottom: 2px solid #09f;
    }
    .panes {
      flex: 1;
      display: flex;
    }
    .panes > div {
      display: none;
      flex: 1;
    }
    .panes > div.active {
      display: block;
    }
    textarea {
      width: 100%;
      height: 100%;
      border: none;
      padding: 0.5em;
      font-family: monospace;
      font-size: 14px;
      resize: none;
      box-sizing: border-box;
      background: #333;
      color: white;
    }
    iframe {
      flex: 1;
      border: none;
    }

    /* 📱 Mobile Layout */
    @media (max-width: 768px) {
      main {
        flex-direction: column;
      }
      .editor {
        width: 100%;
        height: 50%;
        min-width: 0;
        resize: none;
        border-right: none;
        border-bottom: 1px solid #ccc;
      }
      iframe {
        height: 50%;
      }
    }
  </style>
</head>
<body>
  <header>Editor HTML de ElmichiYT</header>
  <main>
    <div class="editor">
      <div class="tabs">
        <button class="active" data-tab="html">HTML</button>
        <button data-tab="css">CSS</button>
        <button data-tab="js">JavaScript</button>
        <button onclick="runCode()">▶️ Ejecutar</button>
      </div>
      <div class="panes">
        <div id="html" class="active"><textarea id="htmlCode" placeholder="Código HTML aquí..."></textarea></div>
        <div id="css"><textarea id="cssCode" placeholder="Código CSS aquí..."></textarea></div>
        <div id="js"><textarea id="jsCode" placeholder="Código JavaScript aquí..."></textarea></div>
      </div>
    </div>
    <iframe id="preview"></iframe>
  </main>

  <script>
    const tabs = document.querySelectorAll('.tabs button[data-tab]');
    const panes = document.querySelectorAll('.panes > div');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        panes.forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    function runCode() {
      const html = document.getElementById('htmlCode').value;
      const css = document.getElementById('cssCode').value;
      const js = document.getElementById('jsCode').value;
      const preview = document.getElementById('preview');
      const content = `
        <!DOCTYPE html>
        <html>
        <head><style>${css}</style></head>
        <body>
        ${html}
        <script>${js}<\/script>
        </body>
        </html>
      `;
      preview.srcdoc = content;
    }
  </script>
</body>
</html>
