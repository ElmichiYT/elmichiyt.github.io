<!DOCTYPE html>
<html lang="es_MX">
<head>
    <title>Teléfonos que he tenido</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="card">
        <h1 style="margin-bottom: 0;" align="center">Teléfonos</h1>
        <p style="margin-top: 0; text-align: center;">Teléfonos que he tenido a lo largo de mi vida.</p>
        <hr>
        <p>
            <strong>NOTA:</strong> puede que no estén todos los teléfonos ya sea porque no sé el modelo (o no me acuerdo) o
            no tengo imagen para ello.
        </p>
        <hr>

        <p>
            <span style="color: #090;">█</span> Teléfono vivo<br>
            <span style="color: #900;">█</span> Teléfono muerto
        </p>

        <div class="tags">
            <div class="tag">
                <img src="images/ZTE_Z2350.png" alt="Z2350" class="vivo">
                <p>ZTE Z2350<br>(ZTE Axon 60 Lite)</p>
            </div>

            <div class="tag">
                <img src="images/moto_XT1955.png" alt="XT1955" class="muerto">
                <p>Moto XT1955<br>(Motorola G7 Power)</p>
            </div>

        </div>
    </div>

</body>
</html>
